[package]
name = "ltk_wad"
version = "0.5.1"
edition = "2021"
description = "WAD archive reading/writing for League Toolkit"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["zstd"]

serde = ["dep:serde", "ltk_hash/serde"]
rust_backend = ["flate2/rust_backend", "ruzstd"]

zstd = ["dep:zstd"]
ruzstd = ["dep:ruzstd"]

[dependencies]
thiserror = { workspace = true }
itertools = { workspace = true }
num_enum = { workspace = true }
memchr = { workspace = true }

byteorder = { workspace = true }

xxhash-rust = { workspace = true }
sha2 = { workspace = true }
rsa = { workspace = true }
zstd = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
flate2 = { workspace = true }

serde = { workspace = true, optional = true }

ltk_io_ext = { version = "0.4.4", path = "../ltk_io_ext" }
ltk_file = { version = "0.2.11", path = "../ltk_file" }
ltk_hash = { version = "0.4.0", path = "../ltk_hash" }

camino = { workspace = true }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
