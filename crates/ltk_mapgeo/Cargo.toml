[package]
name = "ltk_mapgeo"
version = "0.3.0"
edition = "2021"
description = "Map Geometry (.mapgeo) parsing for League Toolkit"
license = "Apache-2.0"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
byteorder = { workspace = true }
bitflags = { workspace = true }
thiserror = { workspace = true }
glam = { workspace = true }

ltk_io_ext = { version = "0.4.7", path = "../ltk_io_ext" }
ltk_primitives = { version = "0.3.6", path = "../ltk_primitives" }
ltk_mesh = { version = "0.5.2", path = "../ltk_mesh" }

[dev-dependencies]
ltk_wad = { path = "../ltk_wad" }
