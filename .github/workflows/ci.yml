name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
          override: true

      # Must come after the toolchain step: the cache key includes `rustc -vV`.
      - name: Set up mbx
        uses: jdx/mr-boxington-action@v1

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: mbx clippy --all-targets

      - name: Build
        run: mbx build --verbose

      - name: Run tests
        run: mbx test --verbose
